<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171b1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WARN Map">
    <title>WARN Map | Kenai Peninsula</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./vendor/maplibre-gl.css">
    <link rel="stylesheet" href="./css/app.css">
    <script src="./vendor/pmtiles.js"></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main id="map" aria-label="Map of the Kenai Peninsula"></main>
    <div class="status-stack">
      <div id="hazard-status" class="hazard-status" role="status" aria-live="polite">
        <span id="hazard-summary">Loading hazards</span>
        <span id="route-status"></span>
        <span id="route-hint" hidden>Tap and hold the map to route here.</span>
        <span id="wake-status">screen may sleep</span>
      </div>
      <section id="route-hazards-panel" class="route-hazards-panel" aria-label="Route plan and hazards" hidden>
        <button id="route-hazards-toggle" class="route-hazards-toggle" type="button" aria-expanded="true" aria-controls="route-panel-body">
          <span id="route-hazards-title"></span>
          <span class="route-hazards-chevron" aria-hidden="true"></span>
        </button>
        <div id="route-panel-body" class="route-panel-body">
          <div id="route-plan" class="route-plan"></div>
          <div id="route-hazards-list" class="route-hazards-list" role="list"></div>
        </div>
      </section>
    </div>
    <div class="map-controls">
      <div id="settings-panel" class="settings-panel" hidden>
        <label for="fare-rate">Rate per mile</label>
        <input id="fare-rate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$ per mile" autocomplete="off">
      </div>
      <button id="settings-toggle" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <div id="route-menu" class="route-menu" role="group" aria-label="Selected point" hidden>
        <button id="route-to-here" type="button">Route to here</button>
        <button id="start-here" type="button">Start here</button>
        <button id="add-stop" type="button">Add stop</button>
      </div>
      <button id="clear-route" type="button" hidden>Clear route</button>
      <button id="locate" type="button" aria-label="Locate me">Locate me</button>
      <p id="location-status" role="status" aria-live="polite"></p>
    </div>
  </body>
</html>
