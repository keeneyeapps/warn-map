<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171b1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WARN Map">
    <title>WARN Map | Kenai Peninsula</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./vendor/maplibre-gl.css">
    <link rel="stylesheet" href="./css/app.css">
    <script src="./vendor/pmtiles.js"></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main id="map" aria-label="Map of the Kenai Peninsula"></main>
    <div class="status-stack">
      <div id="hazard-status" class="hazard-status" role="status" aria-live="polite">
        <span id="hazard-summary">Loading hazards</span>
        <span id="route-status"></span>
        <span id="route-hint" hidden>Tap and hold the map to route here.</span>
        <span id="wake-status">screen may sleep</span>
      </div>
      <section id="route-hazards-panel" class="route-hazards-panel" aria-label="Hazards on your route" hidden>
        <button id="route-hazards-toggle" class="route-hazards-toggle" type="button" aria-expanded="true" aria-controls="route-hazards-list">
          <span id="route-hazards-title"></span>
          <span class="route-hazards-chevron" aria-hidden="true"></span>
        </button>
        <div id="route-hazards-list" class="route-hazards-list" role="list"></div>
      </section>
    </div>
    <div class="map-controls">
      <button id="route-to-here" type="button" hidden>Route to here</button>
      <button id="clear-route" type="button" hidden>Clear route</button>
      <button id="locate" type="button" aria-label="Locate me">Locate me</button>
      <p id="location-status" role="status" aria-live="polite"></p>
    </div>
  </body>
</html>
