<!doctype html>
<html lang="en" data-app="watch" data-app-name="WARN Watch">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WARN Watch">
    <title>WARN Watch</title>
    <link rel="manifest" href="./watch.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./vendor/maplibre-gl.css">
    <link rel="stylesheet" href="./css/app.css">
    <script src="./vendor/pmtiles.js"></script>
    <script type="module" src="./js/header.js"></script>
    <script type="module" src="./js/watch.js"></script>
  </head>
  <body>
    <header id="app-header" class="app-header">
      <img class="app-header-moose" src="./icons/home-moose.webp" alt="" width="43" height="32">
      <span class="app-header-warn">WARN</span>
      <span id="app-header-variant" class="app-header-variant"></span>
    </header>
    <main id="map" aria-label="Map"></main>
    <aside id="watch-panel" class="watch-panel" aria-label="Active hazards">
      <section class="watch-summary">
        <p class="watch-count"><span id="watch-count-number">–</span> <span id="watch-count-label">active hazards</span></p>
        <ul id="watch-categories" class="watch-categories" aria-label="Hazards by category"></ul>
        <p id="watch-updated" class="watch-updated" role="status">Loading hazards</p>
        <p id="watch-stale" class="watch-stale" role="alert" hidden></p>
      </section>
      <ol id="watch-list" class="watch-list" aria-label="Hazards, newest first"></ol>
    </aside>
  </body>
</html>
